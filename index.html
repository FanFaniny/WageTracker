<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Earnings Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hey, Your Live Earnings Tracker</h1>
            <p>Watch your money roll in second by second. Turn your salary into a live ticker and see what your time is actually worth.</p>
        </header>

        <div class="calculator-card">
            <div class="earnings-display">
                <h2>CURRENT SESSION EARNINGS</h2>
                <div class="main-counter" id="mainCounter">0,00000 €</div>
                <div class="metrics">
                    <div class="metric">
                        <div class="value" id="workHours">2.080</div>
                        <div class="label">WORK HOURS/YR</div>
                    </div>
                    <div class="metric">
                        <div class="value per-hour" id="perHour">0,00€</div>
                        <div class="label">PER HOUR</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="income">INCOME AMOUNT</label>
                    <input type="number" id="income" value="4000" placeholder="4000">
                    <span class="currency">€</span>
                </div>

                <div class="input-group">
                    <label for="frequency">FREQUENCY</label>
                    <select id="frequency">
                        <option value="monthly">Monthly Salary</option>
                        <option value="yearly">Yearly Salary</option>
                        <option value="weekly">Weekly Salary</option>
                        <option value="daily">Daily Salary</option>
                        <option value="hourly">Hourly Rate</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="hoursPerWeek">HOURS/WEEK</label>
                    <input type="number" id="hoursPerWeek" value="40" placeholder="40">
                </div>

                <button class="start-button" id="startButton">
                    <span class="play-icon">▶</span> START TIMER
                </button>
            </div>

            <div class="work-hours-tracker">
                <div class="tracker-header">
                    <span>TOTAL WORK HOURS TRACKED</span>
                    <button class="reset-tracker-btn" id="resetTrackerBtn">RESET</button>
                </div>
                <div class="tracker-display">
                    <div class="tracker-unit">
                        <div class="tracker-value" id="trackerHours">00</div>
                        <div class="tracker-label">HOURS</div>
                    </div>
                    <div class="tracker-separator">:</div>
                    <div class="tracker-unit">
                        <div class="tracker-value" id="trackerMinutes">00</div>
                        <div class="tracker-label">MINUTES</div>
                    </div>
                    <div class="tracker-separator">:</div>
                    <div class="tracker-unit">
                        <div class="tracker-value" id="trackerSeconds">00</div>
                        <div class="tracker-label">SECONDS</div>
                    </div>
                </div>
                <div class="manual-input">
                    <input type="number" id="manualHoursInput" placeholder="Add hours manually" step="0.01" min="0">
                    <button id="addManualHours" class="add-hours-btn">ADD</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
